<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCNN Esport</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="top-header">
        <div class="header-inner">
            <button class="menu-btn" id="menu-btn" aria-label="Open Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="header-brand">
                <h1 class="brand-title">CCNN ESPORTS</h1>
                <div class="underline"></div>
            </div>
            <div class="header-spacer"></div>
        </div>
    </header>

    <main class="content">
        <!-- Home Section -->
        <section id="home-view" class="view-section">
            <div class="empty-state">Home Content</div>
        </section>

        <!-- League Section -->
        <section id="league-view" class="view-section active">
            <div class="table-container">
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th class="col-pos">#</th>
                            <th class="col-team">Club</th>
                            <th>MP</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th class="col-pts">Pts</th>
                            <th class="col-gd">GD</th>
                            <th>GF</th>
                            <th>GA</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
            <div id="no-teams-msg" class="empty-state" style="display: none;">No teams added yet. Add teams in Settings.</div>
        </section>

        <!-- Matches Section -->
        <section id="matches-view" class="view-section">
            <div class="matches-header">
                <h2 class="matches-title">Matches</h2>
            </div>

            <div id="matches-list" class="matches-container">
                <!-- Match cards populated via script.js -->
            </div>
            <div id="no-matches-msg" class="empty-state" style="display: none;">No matches scheduled. Tap '+' to create one.</div>

            <!-- Floating Add Match Button -->
            <button id="open-match-modal-btn" class="fab-btn" aria-label="Add Match">+</button>

            <!-- Add Match Modal -->
            <div id="match-modal" class="modal-overlay">
                <div class="modal-content">
                    <h3 class="modal-title">Create Match</h3>
                    <form id="create-match-form">
                        <div class="form-group">
                            <label for="home-team-select">Home Team</label>
                            <select id="home-team-select" required></select>
                        </div>
                        <div class="form-group">
                            <label for="away-team-select">Away Team</label>
                            <select id="away-team-select" required></select>
                        </div>
                        <div class="modal-actions">
                            <button type="button" id="close-modal-btn" class="btn-cancel">Cancel</button>
                            <button type="submit" class="btn-accent">Add Match</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Enter Match Score Modal -->
            <div id="score-modal" class="modal-overlay">
                <div class="modal-content">
                    <h3 class="modal-title">Enter Score</h3>
                    <form id="enter-score-form">
                        <input type="hidden" id="score-match-index">
                        <div class="score-input-row">
                            <label id="score-home-label" class="score-team-label">Home</label>
                            <input type="number" id="home-score-input" min="0" max="99" required placeholder="0">
                        </div>
                        <div class="score-input-row">
                            <label id="score-away-label" class="score-team-label">Away</label>
                            <input type="number" id="away-score-input" min="0" max="99" required placeholder="0">
                        </div>
                        <div class="modal-actions">
                            <button type="button" id="close-score-modal-btn" class="btn-cancel">Cancel</button>
                            <button type="submit" class="btn-accent">Save Result</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Settings Section -->
        <section id="settings-view" class="view-section">
            <div class="settings-container">
                <h2 class="settings-title">Manage Teams</h2>
                
                <form id="add-team-form" class="team-form">
                    <input type="text" id="team-name-input" placeholder="Enter team name" maxlength="20" required autocomplete="off">
                    <button type="submit" class="btn-accent">Add Team</button>
                </form>

                <div class="team-list-section">
                    <h3 class="team-list-title">Current Teams (<span id="team-count">0</span>/8)</h3>
                    <ul id="team-list" class="team-list"></ul>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item" data-target="home-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item active" data-target="league-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"></path><path d="M12 2a4 4 0 0 1 4 4v5c0 1.5-1.5 3-4 3s-4-1.5-4-3V6a4 4 0 0 1 4-4z"></path></svg>
            <span class="nav-label">League</span>
        </button>
        <button class="nav-item" data-target="matches-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><line x1="15" y1="11" x2="15.01" y2="11"></line><line x1="18" y1="13" x2="18.01" y2="13"></line></svg>
            <span class="nav-label">Matches</span>
        </button>
        <button class="nav-item" data-target="settings-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="nav-label">Settings</span>
        </button>
    </nav>

    <script src="./script.js"></script>
</body>
</html>
