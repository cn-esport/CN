<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCNN Esport</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="top-header">
        <h1 class="brand-title">CCNN ESPORTS</h1>
        <div class="underline"></div>
    </header>

    <main class="content">
        <!-- Home Section (Default active) -->
        <section id="home-view" class="view-section active">
            <div class="empty-state">Home Content</div>
        </section>

        <!-- League Section (Table only visible here) -->
        <section id="league-view" class="view-section">
            <div class="table-container">
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th class="col-pos">#</th>
                            <th class="col-team">Club</th>
                            <th>MP</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GD</th>
                            <th class="col-pts">Pts</th>
                            <th>GF</th>
                            <th>GA</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td class="col-pos">1</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                        <tr><td class="col-pos">2</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                        <tr><td class="col-pos">3</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                        <tr><td class="col-pos">4</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                        <tr><td class="col-pos">5</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                        <tr><td class="col-pos">6</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                        <tr><td class="col-pos">7</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                        <tr><td class="col-pos">8</td><td class="col-team"><span class="team-slot"></span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="col-pts">0</td><td>0</td><td>0</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Matches Section -->
        <section id="matches-view" class="view-section">
            <div class="empty-state">Matches Content</div>
        </section>

        <!-- Settings Section -->
        <section id="settings-view" class="view-section">
            <div class="empty-state">Settings Content</div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="home-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-target="league-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"></path><path d="M12 2a4 4 0 0 1 4 4v5c0 1.5-1.5 3-4 3s-4-1.5-4-3V6a4 4 0 0 1 4-4z"></path></svg>
            <span class="nav-label">League</span>
        </button>
        <button class="nav-item" data-target="matches-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><line x1="15" y1="11" x2="15.01" y2="11"></line><line x1="18" y1="13" x2="18.01" y2="13"></line></svg>
            <span class="nav-label">Matches</span>
        </button>
        <button class="nav-item" data-target="settings-view">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="nav-label">Settings</span>
        </button>
    </nav>

    <script src="./script.js"></script>
</body>
</html>
